version: 2
updates:
- package-ecosystem: docker
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "chore(deps-docker)"
  directories:
  - '*'
  groups:
    docker-non-major:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
- package-ecosystem: github-actions
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  commit-message:
    prefix: "chore(deps-github-actions)"
  directory: /
  groups:
    github-actions-non-major:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
- package-ecosystem: gomod
  schedule:
